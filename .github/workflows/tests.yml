name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * *"   # daily, on the newest bytx inside the allowed range

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install '.[test]'
      - name: Tests (no network, no exchange keys)
        run: pytest -q
