[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "free-crypto-arbitrage-scanner"
dynamic = ["version"]
description = "ArbDesk: free crypto arbitrage scanner, terminal and trading journal for 11 exchanges (spreads, funding rates, pair trading, order books, PnL diary, Telegram alerts)"
readme = "README.md"
license = "LicenseRef-BYTtrade-Source-Available-1.3"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "BYTtrade" }]
keywords = ["crypto", "arbitrage", "arbitrage-scanner", "crypto-arbitrage", "funding-rate", "pair-trading",
            "trading-journal", "pnl", "binance", "bybit", "okx", "order-book", "trading-terminal",
            "arbitrage-bot", "spread", "scalping", "crypto-chart", "technical-indicators", "free"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Office/Business :: Financial :: Investment",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
# bytx: <0.3 — несовместимый bytx сначала проверяется и выпускается новой версией панели.
dependencies = [
    "bytx[ws]>=0.2.6,<0.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "aiohttp>=3.9",
    "cryptography>=43",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.urls]
Homepage = "https://byttrade.com/?utm_source=github&utm_medium=free_tool&utm_campaign=free-crypto-arbitrage-scanner&utm_content=pypi"
Repository = "https://github.com/byttrade/free-crypto-arbitrage-scanner"
Documentation = "https://github.com/byttrade/free-crypto-arbitrage-scanner#readme"
Issues = "https://github.com/byttrade/free-crypto-arbitrage-scanner/issues"

[project.scripts]
arbdesk = "arbdesk.__main__:main"
free-crypto-arbitrage-scanner = "arbdesk.__main__:main"

[tool.setuptools]
packages = ["arbdesk"]

[tool.setuptools.dynamic]
version = { attr = "arbdesk.__version__" }

[tool.setuptools.package-data]
arbdesk = ["web/*", "web/**/*"]
