# BYTtrade Arb Terminal
#
# docker compose up -d --build
# open http://127.0.0.1:8780
services:
  terminal:
    build: .
    ports:
      - "127.0.0.1:8780:8780"
    volumes:
      - terminal-data:/data
    restart: unless-stopped
    environment:
      PORT: "8780"
      DATA_DIR: /data
      # Открываете панель не с 127.0.0.1/localhost (LAN-адрес, домен) — перечислите их здесь.
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      # Прокси для биржи, если её режет провайдер: BLOFIN_PROXY=http://host:port
      BLOFIN_PROXY: ${BLOFIN_PROXY:-}

volumes:
  terminal-data:
